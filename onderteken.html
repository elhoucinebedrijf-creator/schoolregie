<!doctype html>
<html lang="nl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>OPP ondertekenen - SchoolRegie</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bitter:wght@700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/assets/styles.css" />
<script src="/assets/config.js"></script>
</head>
<body>
  <div class="center-page">
    <div class="auth-card" style="max-width:520px;">
      <div class="brand-lockup">
        <div class="mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M8 2v4M16 2v4M3 10h18"/></svg></div>
        <div class="name">SchoolRegie</div>
      </div>
      <div class="card" id="content">
        <p>Bezig met laden…</p>
      </div>
    </div>
  </div>

  <script type="module">
    const cfg = window.SUPABASE_CONFIG || {};
    const params = new URLSearchParams(window.location.search);
    const token = params.get('token');
    const FN_URL = `${cfg.url}/functions/v1/openbare-bevestiging`;

    function escapeHtml(str) {
      if (str === null || str === undefined) return '';
      return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    const el = document.getElementById('content');

    function toonFout(reason) {
      el.innerHTML = `<h1 style="font-size:1.15rem;margin-bottom:8px;">Link niet geldig</h1><p>${reason || 'Deze link is niet (meer) geldig.'}</p>`;
    }

    async function laden() {
      if (!token) { toonFout('Er ontbreekt een token in de link.'); return; }
      try {
        const res = await fetch(`${FN_URL}?type=opp&token=${encodeURIComponent(token)}`);
        const data = await res.json();
        if (!data.valid) { toonFout(data.reason); return; }
        el.innerHTML = `
          <h1 style="font-size:1.15rem;margin-bottom:8px;">OPP - ${escapeHtml(data.studentNaam)}</h1>
          <p class="hint" style="margin-bottom:10px;">Lees de samenvatting hieronder. Geef daarna aan of je akkoord gaat.</p>
          <div class="field"><textarea rows="8" readonly>${escapeHtml(data.samenvatting || '(geen samenvatting)')}</textarea></div>
          <div class="field"><label for="naam">Jouw naam (voor ondertekening)</label><input id="naam" /></div>
          <button class="btn btn-primary btn-block" id="btn-akkoord" style="margin-bottom:8px;">Ik heb dit gelezen en ga akkoord</button>
          <div class="field"><label for="toelichting">Toelichting (optioneel, alleen bij niet akkoord)</label><textarea id="toelichting" rows="3"></textarea></div>
          <button class="btn btn-secondary btn-block" id="btn-afwijzen">Ik ga (nog) niet akkoord</button>
          <p id="foutmelding" class="error-text" hidden></p>
        `;
        document.getElementById('btn-akkoord').addEventListener('click', () => versturen('akkoord'));
        document.getElementById('btn-afwijzen').addEventListener('click', () => versturen('afwijzen'));
      } catch (err) {
        toonFout('Er ging iets mis bij het laden. Probeer het later opnieuw.');
      }
    }

    async function versturen(actie) {
      const foutEl = document.getElementById('foutmelding');
      const naam = document.getElementById('naam')?.value.trim();
      if (actie === 'akkoord' && !naam) {
        foutEl.hidden = false;
        foutEl.textContent = 'Vul je naam in om akkoord te geven.';
        return;
      }
      const buttons = el.querySelectorAll('button');
      buttons.forEach((b) => { b.disabled = true; });
      try {
        const res = await fetch(FN_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ type: 'opp', token, actie, naam, toelichting: document.getElementById('toelichting')?.value.trim() || null }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Onbekende fout');
        el.innerHTML = actie === 'akkoord'
          ? `<h1 style="font-size:1.15rem;margin-bottom:8px;">Bedankt!</h1><p>Je akkoord is geregistreerd.</p>`
          : `<h1 style="font-size:1.15rem;margin-bottom:8px;">Doorgegeven</h1><p>De school is op de hoogte gebracht dat je nog niet akkoord gaat.</p>`;
      } catch (err) {
        buttons.forEach((b) => { b.disabled = false; });
        foutEl.hidden = false;
        foutEl.textContent = 'Er ging iets mis - probeer het opnieuw.';
      }
    }

    laden();
  </script>
</body>
</html>
