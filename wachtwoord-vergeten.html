<!doctype html>
<html lang="nl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Wachtwoord vergeten - SchoolRegie</title>
<link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bitter:wght@700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/assets/styles.css" />
<script src="/assets/config.js"></script>
</head>
<body>
  <div class="center-page">
    <div class="auth-card">
      <div class="brand-lockup">
        <div class="mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M8 2v4M16 2v4M3 10h18"/></svg></div>
        <div class="name">SchoolRegie</div>
      </div>
      <div class="card">
        <h1 style="font-size:1.15rem;margin-bottom:2px;">Wachtwoord vergeten</h1>
        <p style="margin-bottom:18px;">Vul je e-mailadres in, dan sturen we een resetlink.</p>
        <form id="forgot-form">
          <div class="field">
            <label for="email">E-mailadres</label>
            <input id="email" type="email" autocomplete="username" required />
          </div>
          <button class="btn btn-primary btn-block" type="submit" id="submit-btn">Resetlink versturen</button>
          <p id="error" class="error-text" hidden></p>
          <p id="success" class="hint" hidden>Check je inbox voor de resetlink.</p>
        </form>
        <p style="margin-top:14px;"><a href="/login.html">Terug naar inloggen</a></p>
      </div>
    </div>
  </div>

  <script type="module">
    import { supabase } from '/assets/supabase-client.js';
    import { $, setLoading, friendlyError } from '/assets/ui.js';

    $('#forgot-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = $('#submit-btn');
      $('#error').hidden = true;
      $('#success').hidden = true;
      setLoading(btn, true, 'Bezig…');
      const email = $('#email').value.trim();
      const { error } = await supabase.auth.resetPasswordForEmail(email, {
        redirectTo: `${window.location.origin}/wachtwoord-resetten.html`,
      });
      setLoading(btn, false);
      if (error) {
        $('#error').hidden = false;
        $('#error').textContent = friendlyError(error);
        return;
      }
      $('#success').hidden = false;
      $('#forgot-form').querySelector('#email').value = '';
    });
  </script>
</body>
</html>
